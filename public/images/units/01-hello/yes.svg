<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .thumb { animation: bounce 1s ease-in-out infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @media (prefers-reduced-motion: reduce) { .thumb { animation: none; } }
  </style>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="#90be6d"/>
  <g class="thumb" fill="#ffffff">
    <rect x="60" y="110" width="78" height="58" rx="20"/>
    <g transform="rotate(-18 90 88)">
      <rect x="76" y="54" width="28" height="68" rx="14"/>
    </g>
  </g>
</svg>
