    @media (prefers-reduced-motion: reduce) { .face { animation: none; } }
  </style>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="#e76f51"/>
  <g class="face">
    <circle cx="100" cy="100" r="48" fill="#ffffff"/>
    <circle cx="86" cy="96" r="7" fill="#5c1f12"/>
    <circle cx="114" cy="96" r="7" fill="#5c1f12"/>
