<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .leave { animation: leave 2.2s ease-in-out infinite; }
    .hand { transform-origin: 13px 34px; animation: wave 0.9s ease-in-out infinite; }
    @keyframes leave { 0%,100% { transform: translateX(0); } 50% { transform: translateX(12px); } }
    @keyframes wave { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }
    @media (prefers-reduced-motion: reduce) { .leave, .hand { animation: none; } }
  </style>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="#126782"/>
  <path d="M20 160 Q100 178 180 160" stroke="#0a4356" stroke-width="8" fill="none" stroke-linecap="round"/>
  <g transform="translate(118,96)">
    <g class="leave">
      <g class="hand" fill="#ffffff">
        <rect x="0" y="34" width="26" height="36" rx="11"/>
        <g transform="translate(13,34)">
          <rect x="-17" y="-36" width="9" height="30" rx="4.5" transform="rotate(-24)"/>
          <rect x="-6" y="-40" width="9" height="34" rx="4.5" transform="rotate(-8)"/>
          <rect x="5" y="-40" width="9" height="34" rx="4.5" transform="rotate(8)"/>
          <rect x="16" y="-36" width="9" height="30" rx="4.5" transform="rotate(24)"/>
        </g>
      </g>
    </g>
  </g>
</svg>
