<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .sun { animation: rise 1.6s ease-in-out infinite alternate; }
    @keyframes rise { 0% { transform: translateY(14px); } 100% { transform: translateY(0px); } }
    @media (prefers-reduced-motion: reduce) { .sun { animation: none; } }
  </style>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="#f4a63c"/>
  <g class="sun">
    <circle cx="100" cy="112" r="40" fill="#ffffff"/>
    <g stroke="#ffffff" stroke-width="9" stroke-linecap="round">
      <line x1="100" y1="58" x2="100" y2="40"/>
      <line x1="66" y1="70" x2="52" y2="58"/>
      <line x1="134" y1="70" x2="148" y2="58"/>
    </g>
  </g>
  <path d="M20 150 Q100 100 180 150 Z" fill="#c97a1e"/>
</svg>
