<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .hands { animation: plead 1.1s ease-in-out infinite; }
    .spark { transform-origin: 100px 71px; animation: twinkle 1.1s ease-in-out infinite; }
    @keyframes plead { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes twinkle { 0%,100% { transform: scale(1); opacity:1; } 50% { transform: scale(1.3); opacity:0.6; } }
    @media (prefers-reduced-motion: reduce) { .hands, .spark { animation: none; } }
  </style>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="#9b5de5"/>
  <g class="hands" fill="#ffffff">
    <rect x="74" y="86" width="24" height="76" rx="11" transform="rotate(-14 86 124)"/>
    <rect x="102" y="86" width="24" height="76" rx="11" transform="rotate(14 114 124)"/>
    <g transform="rotate(-14 86 124)">
      <circle cx="86" cy="90" r="6"/>
      <circle cx="86" cy="78" r="5.5"/>
      <circle cx="86" cy="67" r="5"/>
    </g>
    <g transform="rotate(14 114 124)">
      <circle cx="114" cy="90" r="6"/>
      <circle cx="114" cy="78" r="5.5"/>
      <circle cx="114" cy="67" r="5"/>
    </g>
  </g>
  <path class="spark" d="M100 50 L104 60 L115 62 L107 70 L109 81 L100 75 L91 81 L93 70 L85 62 L96 60 Z" fill="#ffd166"/>
</svg>
