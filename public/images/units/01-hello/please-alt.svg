<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .hands { animation: plead 1.1s ease-in-out infinite; }
    .spark { transform-origin: 100px 70px; animation: twinkle 1.1s ease-in-out infinite; }
    @keyframes plead { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes twinkle { 0%,100% { transform: scale(1); opacity:1; } 50% { transform: scale(1.3); opacity:0.6; } }
    @media (prefers-reduced-motion: reduce) { .hands, .spark { animation: none; } }
  </style>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="#6c3fa8"/>
  <g transform="translate(100,106) rotate(8)">
    <g class="hands" fill="#ffffff">
      <rect x="-36" y="-42" width="24" height="76" rx="11" transform="rotate(-16)"/>
      <rect x="12" y="-42" width="24" height="76" rx="11" transform="rotate(16)"/>
      <g transform="rotate(-16)">
        <circle cx="-24" cy="-38" r="6"/>
        <circle cx="-24" cy="-49" r="5.5"/>
        <circle cx="-24" cy="-60" r="5"/>
      </g>
      <g transform="rotate(16)">
        <circle cx="24" cy="-38" r="6"/>
        <circle cx="24" cy="-49" r="5.5"/>
        <circle cx="24" cy="-60" r="5"/>
      </g>
    </g>
  </g>
  <circle class="spark" cx="100" cy="70" r="10" fill="#ffd166"/>
</svg>
