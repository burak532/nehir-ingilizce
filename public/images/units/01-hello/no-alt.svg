<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .arms { transform-origin: 100px 100px; animation: sway 1.2s ease-in-out infinite; }
    @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .arms { animation: none; } }
  </style>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="#9e3a24"/>
  <g class="arms" fill="#ffffff">
    <rect x="60" y="92" width="80" height="20" rx="10" transform="rotate(28 100 102)"/>
    <rect x="60" y="92" width="80" height="20" rx="10" transform="rotate(-28 100 102)"/>
  </g>
</svg>
