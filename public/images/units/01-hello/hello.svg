<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .hand { transform-origin: 106px 172px; animation: wave 1.1s ease-in-out infinite; }
    @keyframes wave { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
    @media (prefers-reduced-motion: reduce) { .hand { animation: none; } }
  </style>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="#8ecae6"/>
  <circle cx="44" cy="46" r="16" fill="#ffd166"/>
  <g class="hand" fill="#ffffff">
    <rect x="86" y="118" width="40" height="54" rx="16"/>
    <g transform="translate(106,118)">
      <rect x="-26" y="-54" width="14" height="46" rx="7" transform="rotate(-24)"/>
      <rect x="-9" y="-60" width="14" height="52" rx="7" transform="rotate(-8)"/>
      <rect x="8" y="-60" width="14" height="52" rx="7" transform="rotate(8)"/>
      <rect x="25" y="-54" width="14" height="46" rx="7" transform="rotate(24)"/>
    </g>
  </g>
</svg>
